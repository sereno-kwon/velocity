name: Fetch images from Velocity USA

# tools/fetch_images.py 로 velocityusa.com(Shopify)의 제품, 브랜드 이미지를 받아 images/ 에 커밋합니다.
# 이미 있는 파일은 건너뜁니다. 다시 받으려면 파일을 지우고 Actions에서 Run workflow를 누르세요.
on:
  push:
    branches: [main]
    paths: [tools/fetch_images.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download
        id: dl
        run: python3 tools/fetch_images.py
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet && echo "no changes" || git commit -m "Add images from Velocity USA"
          git push
      - name: Report
        if: steps.dl.outcome == 'failure'
        run: |
          echo "::warning::일부 이미지를 받지 못했습니다. Download 단계 로그의 FAIL 줄을 확인하세요."
          exit 1
